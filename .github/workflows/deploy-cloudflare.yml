name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vitest run src/persistence
      - run: npm run build
      - run: npm run check:worker-assets

  deploy:
    name: Deploy worker
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it under Settings → Secrets → Actions (not Variables)."
            exit 1
          fi
          if printf '%s' "${CLOUDFLARE_API_TOKEN}" | grep -qE '[[:space:]]'; then
            echo "::error::CLOUDFLARE_API_TOKEN contains whitespace. Recreate the secret and paste the raw token only (no quotes, no newline)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing. Add it as a repo Variable or Secret."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/cf-verify.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Cloudflare rejected the API token (HTTP ${HTTP_CODE}). Create a new token with template 'Edit Cloudflare Workers' and update the secret."
            cat /tmp/cf-verify.json || true
            exit 1
          fi
          WORKER_CODE=$(curl -sS -o /tmp/cf-worker.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fussballmanager")
          if [ "${WORKER_CODE}" = "403" ] || [ "${WORKER_CODE}" = "401" ]; then
            echo "::error::Token cannot access Worker 'fussballmanager' (HTTP ${WORKER_CODE}). Use a custom token: Account → Workers Scripts → Edit on the whole account (not a single Worker scope)."
            cat /tmp/cf-worker.json || true
            exit 1
          fi
          if [ "${WORKER_CODE}" = "404" ]; then
            echo "Worker 'fussballmanager' does not exist yet — first deploy needs account-level Workers Scripts Edit (Admin) on the account."
          else
            echo "Cloudflare token verified (worker HTTP ${WORKER_CODE})."
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
