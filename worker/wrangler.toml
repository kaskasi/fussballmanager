name = "fussballmanager"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

# Build the Vite SPA before bundling the worker.
[build]
command = "npm run build --prefix .."

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/health", "/api/health"]
