name = "fussballmanager"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

# Full match sim needs more than the free-tier CPU budget (~10ms). Paid Workers only.
[limits]
cpu_ms = 30_000

# Build the Vite SPA before bundling the worker.
[build]
command = "npm run build --prefix .."

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]
